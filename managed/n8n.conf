# wmw-managed {"v":1,"kind":"proxy","port":5678,"scheme":"http","websocket":true,"streaming":true,"maxBodyMb":50}
# Generated by the site agent. Change it in the BackOffice (Sites > Apps): manual edits are overwritten.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name n8n.wemeweb.com;

    client_max_body_size 50m;
    charset utf-8;

    ssl_certificate /etc/letsencrypt/live/wemeweb.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wemeweb.com/privkey.pem;

    error_log  /var/log/nginx/wemeweb.com/n8n-error.log;
    access_log /var/log/nginx/wemeweb.com/n8n-access.log;

    # Gzip
    include /etc/nginx/includes/gzip.conf;

    location / {
        expires $expires;

        proxy_redirect                      off;
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
        proxy_read_timeout                  3600;
        proxy_connect_timeout               1m;
        proxy_send_timeout                  3600;
        proxy_buffering                     off;
        proxy_cache                         off;
        chunked_transfer_encoding          off;

        proxy_pass                          http://127.0.0.1:5678;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
